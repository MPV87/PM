<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zorr Powermatic – Website im Aufbau</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
height:100vh;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
color:white;

/* Vollbild Hintergrund */
background:url("im-aufbau.jpg") no-repeat center center fixed;
background-size:cover;

display:flex;
flex-direction:column;
justify-content:space-between;
align-items:center;
text-align:center;
}

/* leichtes dunkles Overlay */
body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.35);
z-index:0;
}

/* Inhalt */
.content{
position:relative;
z-index:1;
margin-top:18vh;
padding:20px;
}

h1{
font-weight:500;
letter-spacing:2px;
font-size:34px;
margin-bottom:10px;
}

p{
font-size:16px;
color:#e5e5e5;
max-width:520px;
}

/* Kontaktbereich */
.footer{
position:relative;
z-index:1;
margin-bottom:40px;
}

.contact{
display:inline-block;
padding:12px 26px;
border:1px solid rgba(255,255,255,0.8);
border-radius:30px;
text-decoration:none;
color:white;
font-size:14px;
letter-spacing:1px;
transition:all .25s ease;
}

.contact:hover{
background:white;
color:black;
}

</style>
</head>

<body>

<div class="content">

<h1>

<p>
Die Website zu den originalen Zorr Powermatic Stopfmaschinen befindet sich derzeit im Aufbau.
</p></h1>

</div>

<div class="footer">

<a class="contact"
href="mailto:office@kp-plattener.at?subject=Zorr%20Powermatic">
Kontakt
</a>

</div>

</body>

</html>
